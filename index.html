<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InvestRight Login Callback</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; }
  .box { background: #f4f4f5; border-radius: 10px; padding: 20px; word-break: break-all; font-family: monospace; }
  button { margin-top: 14px; padding: 10px 18px; border: none; border-radius: 8px; background: #4f46e5; color: white; cursor: pointer; font-size: 14px; }
  button:hover { background: #4338ca; }
  h2 { margin-bottom: 4px; }
  .hint { color: #666; font-size: 14px; }
</style>
</head>
<body>
  <h2>Login captured</h2>
  <p class="hint">Copy the value below back into your terminal.</p>
  <div class="box" id="token">(reading URL...)</div>
  <button onclick="copyToken()">Copy</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("request_token") || params.get("code") || params.get("token");
    const el = document.getElementById("token");
    el.textContent = token ? token : "No token found in URL - full query string: " + window.location.search;

    function copyToken() {
      navigator.clipboard.writeText(el.textContent);
      alert("Copied!");
    }
  </script>
</body>
</html>
